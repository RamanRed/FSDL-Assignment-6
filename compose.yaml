services:

  postgres:
    image: postgres:16-alpine
    container_name: canteen-postgres

    environment:
      POSTGRES_DB: doctor_appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - app-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: canteen-backend

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/doctor_appointment_db
      KITCHEN_SERVICE_URL: http://kitchen-service:3003

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - kitchen-service

    networks:
      - app-network


  kitchen-service:
    build:
      context: ./kitchen-service
      dockerfile: Dockerfile

    container_name: kitchen-service

    environment:
      PORT: 3003
      SERVICE_NAME: kitchen-service

    ports:
      - "3003:3003"

    networks:
      - app-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: canteen-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - app-network


volumes:
  pgdata:


networks:
  app-network:
    driver: bridge
