services:

  postgres:
    image: postgres:16-alpine
    container_name: doctor-postgres
    restart: always
    environment:
      POSTGRES_DB: doctor_appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctor-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/doctor_appointment_db
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doctor-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
    name: pgdata

networks:
  app-network:
    name: app-network
    driver: bridge
