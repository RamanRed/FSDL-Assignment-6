services:
  # Database Service (PostgreSQL on lightweight Alpine Linux ~80MB)
  postgres:
    image: postgres:16-alpine
    container_name: doctor-appointment-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doctor_appointment_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network

  # Backend Service (Express + Node.js on Node 20 Alpine)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctor-appointment-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/doctor_appointment_db
    depends_on:
      - postgres
    networks:
      - app-network

  # Frontend Service (React + Vite served via Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
    container_name: doctor-appointment-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pg-data:

networks:
  app-network:
    driver: bridge
